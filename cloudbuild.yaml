steps:
  # Build Docker image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'build'
      - '-t'
      - 'gcr.io/$PROJECT_ID/studysense-backend:$SHORT_SHA'
      - '-f'
      - 'src/SSS.Web/Dockerfile'  
      - 'src'                      

  # Push image
  - name: 'gcr.io/cloud-builders/docker'
    args:
      - 'push'
      - 'gcr.io/$PROJECT_ID/studysense-backend:$SHORT_SHA'

  # Deploy Cloud Run
  - name: 'gcr.io/google.com/cloudsdktool/cloud-sdk'
    entrypoint: gcloud
    args:
      - run
      - deploy
      - studysense-backend
      - --image
      - gcr.io/$PROJECT_ID/studysense-backend:$SHORT_SHA
      - --region
      - europe-west1
      - --platform
      - managed
      - --allow-unauthenticated